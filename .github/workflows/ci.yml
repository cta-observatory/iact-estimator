name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  tests:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
        install-method: [mamba, pixi]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up mamba environment
        if: matrix.install-method == 'mamba'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          create-args: >-
            python=${{ matrix.python-version }}
          cache-downloads: true

      - name: Set up Pixi
        if: matrix.install-method == 'pixi'
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          cache: true

      - name: Verify Python version
        run: |
          if [[ "${{ matrix.install-method }}" == "pixi" ]]; then
            pixi run -e ci-py${{ matrix.python-version == '3.12' && '312' || '313' }} python --version
          else
            python --version
          fi

      - name: Run tests
        run: |
          if [[ "${{ matrix.install-method }}" == "pixi" ]]; then
            pixi run -e ci-py${{ matrix.python-version == '3.12' && '312' || '313' }} pytest
          else
            python -m pip install -e ".[dev]"
            pytest
          fi

  docs:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          cache: true

      - name: Produce changelog
        run: pixi run -e docs-py312 towncrier build --yes

      - name: Build documentation
        run: |
          pixi run -e docs-py312 docs
