# To create this environment:
# conda env create -f environment.yml
# or mamba env create -f environment.yml
name: iact-estimator
channels:
  - conda-forge
dependencies:
  - python
  - pip
  - astropy
  - matplotlib
  - astroquery>=0.4.8
  - gammapy=2.1
  - regions=0.11
  - seaborn
  # Documentation
  - furo
  - ipywidgets
  - myst-nb
  - numpydoc
  - rstcheck
  - sphinx-argparse
  - sphinx-autoapi
  - sphinx-copybutton
  - sphinxcontrib-towncrier
  - towncrier<24.7
  # Testing
  - pytest
  - pytest-console-scripts
  # Development
  - pre-commit
  - ruff
  # PyPI-only or dev dependencies
  - pip:
      - git+https://github.com/astropy/astroplan.git
      - starplot==0.22.0
